name: Deploy frontend

# Builds the React/Vite site and pushes it to the S3 bucket that CloudFront
# (automax.ie) serves, then invalidates the distribution. CDK owns the bucket
# and the distribution; this workflow owns their *contents*.
#
# Manual trigger only for now. To deploy on every push to main instead, add:
#   push:
#     branches: [main]
#     paths: ['frontend/**']

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: eu-west-1
      # Deterministic bucket name from the CDK stack
      # (automax-frontend-<account>-<region>). Override with a repo variable
      # named FRONTEND_BUCKET if it ever changes.
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET || 'automax-frontend-620893829175-eu-west-1' }}
      # Not deterministic -- set a repo variable CLOUDFRONT_DISTRIBUTION_ID.
      # Find it with:
      #   aws cloudfront list-distributions \
      #     --query "DistributionList.Items[?contains(Aliases.Items, 'automax.ie')].Id" --output text
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_PHOTOS_CDN_URL: ${{ secrets.VITE_PHOTOS_CDN_URL }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Configure AWS credentials
        # Static keys for now. Preferred upgrade: an IAM role assumed via GitHub
        # OIDC (permissions: id-token: write) so there are no long-lived keys.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync to S3
        working-directory: frontend
        run: |
          # Long-cache the fingerprinted assets, no-cache the HTML entrypoint so
          # a new deploy is picked up immediately.
          aws s3 sync dist/ "s3://${FRONTEND_BUCKET}/" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "::error::CLOUDFRONT_DISTRIBUTION_ID repo variable is not set."
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Smoke check
        run: |
          sleep 15
          html="$(curl -fsSL https://automax.ie/)"
          echo "$html" | grep -qi "<title" || { echo "::error::homepage returned no <title>"; exit 1; }
          if echo "$html" | grep -qi "base44"; then
            echo "::warning::'base44' still referenced in the served HTML"
          fi
