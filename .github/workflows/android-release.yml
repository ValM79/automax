name: Android release build

# Builds a signed release AAB and uploads it as a downloadable workflow
# artifact. Does NOT publish to Play Console -- that stays a manual step
# (upload the artifact yourself), same as the iOS workflow doesn't
# auto-release to the App Store either. See frontend/android/README or
# session notes for the Play Console upload flow.
#
# Before running: bump versionCode/versionName in
# frontend/android/app/build.gradle and commit that first -- this
# workflow builds whatever's on the selected ref, it doesn't bump
# versions for you.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps and build web app
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_PHOTOS_CDN_URL: ${{ secrets.VITE_PHOTOS_CDN_URL }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Capacitor sync Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Standard base64-secret pattern for getting a release keystore onto
      # an ephemeral runner, mirroring how ios-testflight.yml handles the
      # Apple distribution cert. Needs 4 repo secrets:
      #   ANDROID_KEYSTORE_BASE64   -- `base64 -w0 upload-keystore.jks`
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS         -- "upload" for this project
      #   ANDROID_KEY_PASSWORD
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          echo "decoded keystore: $(wc -c < "$KEYSTORE_PATH") bytes"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Write keystore.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > frontend/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Verify signature
        working-directory: frontend/android
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMax-release.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
